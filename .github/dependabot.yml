version: 2
updates:
  # pnpm is covered by the "npm" ecosystem value
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react*", "@types/react*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
